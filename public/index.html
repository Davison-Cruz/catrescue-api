<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>CatRescue - Upload de Foto</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .card {
        border: 1px solid #ccc;
        padding: 20px;
        max-width: 300px;
        border-radius: 8px;
      }
      button {
        margin-top: 10px;
        padding: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>CatRescue API</h2>
      <p>Envie a foto do felino (ID: 1):</p>

      <form id="form-foto">
        <input type="file" id="arquivo-foto" accept="image/*" required />
        <button type="submit">Salvar Foto</button>
      </form>

      <p id="mensagem"></p>
    </div>

    <script>
      document
        .getElementById("form-foto")
        .addEventListener("submit", async (evento) => {
          evento.preventDefault(); // Evita que a tela pisque/recarregue

          const arquivo = document.getElementById("arquivo-foto").files[0];

          // O FormData cria aquele exato pacote "multipart/form-data" que o Thunder Client cobrava
          const pacote = new FormData();
          pacote.append("foto", arquivo);

          try {
            // Dispara a requisição POST para a sua API
            const resposta = await fetch("/gatos/1/foto", {
              method: "POST",
              body: pacote,
            });

            const dados = await resposta.json();
            document.getElementById("mensagem").innerText =
              dados.mensagem || dados.erro;
            document.getElementById("mensagem").style.color = resposta.ok
              ? "green"
              : "red";
          } catch (erro) {
            document.getElementById("mensagem").innerText =
              "Erro ao conectar com o servidor.";
          }
        });
    </script>
  </body>
</html>
